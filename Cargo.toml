# Context Drop — Rust workspace (core + clipboard + CLI).
#
# The Tauri desktop crate lives in `apps/desktop/src-tauri` as its own workspace
# (it depends on these crates via path). Keeping it out of this workspace keeps
# `cargo test --workspace` fast and hermetic: all core/routing/concurrency tests
# run here without pulling in the heavy WebView/GUI dependency graph.
[workspace]
resolver = "2"
members = [
    "crates/context-drop-core",
    "crates/context-drop-clipboard",
    "crates/context-drop-cli",
    "tests",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Context Drop contributors"]
repository = "https://github.com/context-drop/context-drop"
homepage = "https://github.com/context-drop/context-drop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"

# Internal crates (path deps so the CLI and clipboard crates can share the core).
context-drop-core = { path = "crates/context-drop-core" }
context-drop-clipboard = { path = "crates/context-drop-clipboard" }

[profile.release]
strip = true
lto = "thin"
