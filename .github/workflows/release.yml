# Release workflow — signed + notarized macOS build on tag push.
#
# Pushing a version tag (e.g. `v0.1.1`) builds the desktop app, signs it with the
# Developer ID certificate, notarizes it with Apple, and attaches the bundle to a
# GitHub Release.
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE           base64 of the exported "Developer ID Application"
#                               .p12 (Team 6XC66ZV9WK). Export from Keychain
#                               Access, then: base64 -i cert.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD  the password you set when exporting the .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: EarthLink Network (6XC66ZV9WK)"
#   APPLE_ID                    the Apple ID email on that team (uehara@eln.ne.jp)
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               6XC66ZV9WK
#
# Without these secrets the build still runs but is UNSIGNED (Gatekeeper will warn
# on first launch). GITHUB_TOKEN is provided automatically.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & release (macOS)
    runs-on: macos-14 # Apple Silicon runner (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the frontend + bundles the app, then (if the Apple secrets are
      # present) signs and notarizes it and attaches it to the GitHub Release.
      - name: Build, sign, notarize, release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Context Drop ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for what's in this release."
          releaseDraft: false
          prerelease: false
