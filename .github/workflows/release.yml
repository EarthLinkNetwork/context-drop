# Release workflow — signed + notarized macOS build on tag push.
#
# Pushing a version tag (e.g. `v0.1.1`) builds the desktop app, signs it with the
# Developer ID certificate, notarizes it with Apple, and attaches the bundle to a
# GitHub Release.
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE           base64 of the exported "Developer ID Application"
#                               .p12 (Team 6XC66ZV9WK). Export from Keychain
#                               Access, then: base64 -i cert.p12 | pbcopy
#   APPLE_CERTIFICATE_PASSWORD  the password you set when exporting the .p12
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: EarthLink Network (6XC66ZV9WK)"
#   APPLE_ID                    the Apple ID email on that team (uehara@eln.ne.jp)
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               6XC66ZV9WK
#
# All six are REQUIRED: the job fails fast (naming the missing ones) instead of
# failing later inside codesign. GITHUB_TOKEN is provided automatically.
#
# A tag push builds, signs, notarizes, and publishes the GitHub Release.
# A manual run (workflow_dispatch) does the same build/sign/notarize as a dry
# run but publishes NOTHING — the notarized DMG is uploaded as a workflow
# artifact instead (so running it from `main` can never create a "main" release).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & release (macOS)
    runs-on: macos-14 # Apple Silicon runner (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see the header of release.yml)"
            exit 1
          fi

      # Builds the frontend and bundles the app; tauri signs and notarizes the
      # .app. It never publishes: the DMG itself is notarized + stapled below
      # first (as the local releases were), then published on a tag push.
      - name: Build and sign (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop

      - name: Notarize and staple the DMG
        id: dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          out="Context-Drop-${REF_NAME//\//-}-macos-arm64.dmg"
          cp "$src" "$out"
          xcrun notarytool submit "$out" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m | tee notarize.log
          grep -q "status: Accepted" notarize.log
          xcrun stapler staple "$out"
          xcrun stapler validate "$out"
          spctl -a -vvv -t install "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # Only a tag PUSH publishes; any manual run (even on a tag) builds only.
      - name: Publish GitHub Release (tag push)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" --title "Context Drop $TAG" \
              --notes "See CHANGELOG.md for what's in this release."
          fi

      - name: Upload notarized DMG (manual dry run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: context-drop-macos-arm64
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
